<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impostor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/home.css?v=2">
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="container">
      <div class="game-card">
        <div class="screen-track" id="screen-track">
      <section class="screen home-screen">
        <h1 class="game-title">Impostor</h1>

        <p class="game-description">Alle bekommen das geheime Wort – außer den Impostoren. Gebt eure Hinweise, achtet darauf, was die anderen sagen, und findet heraus, wer die Wahrheit nicht kennt.
        </p>

        <div class="options-card">
          <button class="option" id="players-option" type="button">
            <span class="option-name">Spieler</span>
            <span class="option-value" id="player-count-value">4</span>
            <svg class="option-chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </button>

          <div class="option-divider"></div>

          <div class="option">
            <span class="option-name">Impostor</span>
            <span class="option-value">1</span>
            <svg class="option-chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </div>

          <div class="option-divider"></div>

          <div class="option">
            <span class="option-name">Hinweise für den Impostor</span>
            <label class="option-switch">
              <input class="switch-input" type="checkbox" aria-label="Hinweise für den Impostor aktivieren">
              <span class="switch-thumb"></span>
            </label>
          </div>

          <div class="option-divider"></div>

          <div class="option">
            <span class="option-name">Kategorien</span>
            <span class="option-value">Alle</span>
            <svg class="option-chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </div>
        </div>

        <button class="play-button" type="button">Spiel starten</button>
      </section>

      <section class="screen player-screen" aria-hidden="true" inert>
        <button class="back-button" id="players-back" type="button">
          <svg class="back-chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          <span>Zurück</span>
        </button>

        <div class="player-heading">
          <h1 class="player-title">Spieler</h1>
          <span class="player-count-badge" id="active-player-count">4/20</span>
        </div>
        <div class="player-list-scroll" id="player-list-scroll">
          <div class="player-list" id="player-list"></div>
        </div>

        <p class="player-form-message" id="player-form-message" role="status" aria-live="polite"></p>
        <form class="add-player-form" id="add-player-form">
          <input
            class="add-player-input"
            id="new-player-name"
            type="text"
            placeholder="Neuer Spieler"
            maxlength="30"
            autocomplete="off"
          >
          <button class="add-player-button" id="add-player-button" type="submit" aria-label="Spieler hinzufügen">
            <svg class="button-icon plus-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14"/>
              <path d="M12 5v14"/>
            </svg>
          </button>
          <button class="delete-player-button" id="delete-player-button" type="button" aria-label="Ausgewählten Spieler löschen" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 11v6"/>
              <path d="M14 11v6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
              <path d="M3 6h18"/>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </form>
      </section>
      </div>
      </div>
    </div>
  </main>

  <script src="js/component-loader.js"></script>
  <script src="js/player-count.js"></script>
</body>
</html>
